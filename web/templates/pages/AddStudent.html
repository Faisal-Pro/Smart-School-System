{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student | Admin Portal</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --identity-blue: #3282b8;
            --dark-steel: #1b262c;
            --white: #ffffff;
            --bg-muted: #f8fafc;
            --border-soft: #e2e8f0;
            --text-dark: #0f172a;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--dark-steel);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* === DASHBOARD BACK BUTTON === */
        .dashboard-nav {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 100;
        }

        .btn-dashboard {
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: 0.3s all ease;
        }

        .btn-dashboard:hover {
            background: var(--identity-blue);
            border-color: var(--identity-blue);
            transform: translateX(5px);
            box-shadow: 0 10px 20px rgba(50, 130, 184, 0.3);
        }

        /* === FORM CARD === */
        .form-card {
            background: var(--white);
            width: 100%;
            max-width: 650px;
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .header-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-section img {
            width: 90px;
            height: 90px;
            border-radius: 20px;
            margin-bottom: 15px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }

        .header-section h1 {
            font-size: 28px;
            color: var(--dark-steel);
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
        }

        /* === GRID LAYOUT === */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .full-width { grid-column: span 2; }

        .input-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-dark);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 14px 18px;
            font-size: 15px;
            border-radius: 12px;
            border: 2px solid var(--border-soft);
            background-color: var(--bg-muted);
            transition: 0.3s ease;
            color: var(--text-dark);
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--identity-blue);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(50, 130, 184, 0.15);
        }

        /* === FILE UPLOAD === */
        .upload-zone {
            background: var(--bg-muted);
            border: 2px dashed var(--border-soft);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-zone:hover {
            border-color: var(--identity-blue);
            background: #f0f7ff;
        }

        .upload-zone i { font-size: 32px; color: var(--identity-blue); margin-bottom: 10px; }

        /* === SUBMIT BUTTON === */
        .submit-btn {
            width: 100%;
            margin-top: 15px;
            padding: 18px;
            background: var(--identity-blue);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(50, 130, 184, 0.4);
        }

        /* === ALERT === */
        .success-toast {
            margin-top: 30px;
            padding: 15px;
            background: #dcfce7;
            color: #14532d;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            border-left: 5px solid #22c55e;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .dashboard-nav { top: 15px; left: 15px; position: absolute; }
        }
    </style>
</head>

<body>

<div class="dashboard-nav">
    <a href="{% url 'DirectAdminPage' %}" class="btn-dashboard">
        <i class="fas fa-th-large"></i> Dashboard
    </a>
</div>

<div class="form-card">
    <div class="header-section">
        <img src="{% static 'Images/School logo.jpg' %}" alt="Logo">
        <h1>Student Registration</h1>
    </div>

    <form id="add-form" method="post" action="{% url 'add_student' %}" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-grid">
            <div class="input-group full-width">
                <label>Full Name</label>
                <input type="text" name="student_name" placeholder="Full Legal Name" required>
            </div>

            <div class="input-group">
                <label>System ID</label>
                <input type="number" name="student_id" value="{{ LastRecord }}" required>
            </div>

            <div class="input-group">
                <label>Age</label>
                <input type="number" name="student_age" placeholder="Current Age" required>
            </div>

            <div class="input-group">
                <label>Nationality</label>
                <select name="student_nationality" required>
                    <option value="Egypt">Egypt</option>
                    <option value="Sudan">Sudan</option>
                    <option value="Jordan">Jordan</option>
                    <option value="Libya">Libya</option>
                    <option value="Palestine">Palestine</option>
                </select>
            </div>

            <div class="input-group">
                <label>Grade Level</label>
                <select name="student_level">
                    {% for n in levels %}
                        <option value="{{ n }}">Grade {{ n }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="input-group">
                <label>Historical CGPA</label>
                <input type="number" name="student_cgpa" step="0.01" required>
            </div>

            <div class="input-group">
                <label>Academic Year (Level)</label>
                <select name="student_level" required>
                    <option value="1">Level 1 (Freshman)</option>
                    <option value="2">Level 2 (Sophomore)</option>
                    <option value="3">Level 3 (Junior)</option>
                    <option value="4">Level 4 (Senior)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Entry Year</label>
                <input type="number" name="entry_year" value="2024" required>
            </div>

            <div class="input-group">
                <label>National ID</label>
                <input type="text" name="national_id" placeholder="14-digit identifier" required>
            </div>

            <div class="input-group">
                <label>Gender</label>
                <select name="student_gender">
                    <option>Male</option>
                    <option>Female</option>
                </select>
            </div>

            <div class="input-group full-width">
                <label>Profile Picture</label>
                <div class="upload-zone" onclick="document.getElementById('student_image').click()">
                    <i class="fas fa-cloud-arrow-up"></i>
                    <p id="file-label" style="margin:0; font-size: 14px; color: #64748b;">Click to upload high-res photo</p>
                    <input type="file" id="student_image" name="student_image" required onchange="showName()" style="display:none;">
                </div>
            </div>
        </div>

        <button type="submit" class="submit-btn">
            Register Student
        </button>
    </form>

    {% if messages %}
        {% for message in messages %}
            <div class="success-toast">
                <i class="fas fa-check-circle"></i> {{ message }}
            </div>
        {% endfor %}
    {% endif %}
</div>

<script>
    function showName() {
        let file = document.getElementById("student_image").files[0];
        if (file) {
            document.getElementById("file-label").textContent = "Selected: " + file.name;
            document.getElementById("file-label").style.color = "#3282b8";
        }
    }
</script>

</body>
</html>
