{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Course | Admin Portal</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --dark: #0f172a;
            --slate: #64748b;
            --glass: rgba(255, 255, 255, 0.03);
            --card-bg: #ffffff;
            --input-bg: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .top-nav {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 20px 40px; display: flex; justify-content: flex-end; z-index: 10;
        }

        .btn-dashboard {
            text-decoration: none; background: var(--glass); color: white;
            padding: 10px 20px; border-radius: 12px; font-weight: 600;
            backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }

        .btn-dashboard:hover { background: white; color: var(--dark); }

        .container { width: 100%; max-width: 600px; }

        .add-course-card {
            background: var(--card-bg); padding: 50px; border-radius: 32px;
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.5);
        }

        .header-section { text-align: center; margin-bottom: 40px; }
        .header-section img { width: 70px; border-radius: 20px; margin-bottom: 20px; }
        .header-section h1 { font-size: 28px; font-weight: 800; color: var(--dark); }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-width { grid-column: span 2; }

        .input-group { margin-bottom: 24px; }
        .input-group label {
            display: block; font-weight: 700; font-size: 13px; color: var(--slate);
            margin-bottom: 10px; text-transform: uppercase;
        }

        input {
            width: 100%; padding: 16px 20px; border-radius: 16px;
            border: 2px solid #f1f5f9; background: var(--input-bg);
            font-size: 15px; transition: all 0.25s ease;
        }

        input:focus { outline: none; border-color: var(--accent); background: white; }

        .upload-zone {
            display: block; background: #f8fafc; border: 2px dashed #cbd5e1;
            border-radius: 20px; padding: 30px; text-align: center; cursor: pointer;
        }

        #file-name-display { color: var(--accent); font-weight: 700; margin-top: 10px; }

        .submit-btn {
            width: 100%; padding: 18px; background: var(--accent); color: white;
            border: none; border-radius: 18px; font-weight: 700; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 12px;
        }

        .alert {
            margin-top: 25px; padding: 16px; border-radius: 16px;
            background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0;
            text-align: center; font-weight: 600;
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="{% url 'DirectAdminPage' %}" class="btn-dashboard">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
    </nav>

    <div class="container">
        <div class="add-course-card">
            <div class="header-section">
                <img src="{% static 'Images/School logo.jpg' %}" alt="Logo">
                <h1>Add New Course</h1>
                <p>Register a new academic module to the database.</p>
            </div>

            <form id="add-course-form" method="post" action="{% url 'add_course' %}" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="form-grid">
                    <div class="input-group full-width">
                        <label for="course_name">Official Course Title</label>
                        <input type="text" id="course_name" name="course_name" placeholder="e.g. Theoretical Physics" required>
                    </div>

                    <div class="input-group">
                        <label for="course_id">Registry ID</label>
                        <input type="number" id="course_id" name="course_id" value="{{ LastRecord }}" readonly>
                    </div>


                    <div class="input-group full-width">
                        <label for="course_level">Difficulty / Grade Level</label>
                        <input type="text" id="course_level" name="course_level" placeholder="e.g. Undergraduate" required>
                    </div>

                    <input type="hidden" name="link_url" value="#">

                    <div class="input-group full-width">
                        <label>Display Banner</label>
                        <label for="course_image" class="upload-zone">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Drop course cover here or click to browse</p>
                            <div id="file-name-display">No file selected</div>
                        </label>
                        <input type="file" id="course_image" name="course_image" accept="image/*" required onchange="showFileName()">
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submit-button">
                    <span>Finalize Course Creation</span>
                    <i class="fas fa-chevron-right"></i>
                </button>
            </form>

            <div id="message-container"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        function showFileName() {
            const fileInput = document.getElementById('course_image');
            const display = document.getElementById('file-name-display');
            if (fileInput.files.length > 0) {
                display.textContent = "Selected: " + fileInput.files[0].name;
            }
        }

        $(document).ready(function() {
            $('#add-course-form').on('submit', function(event) {
                event.preventDefault();
                
                const $btn = $('#submit-button');
                const originalText = $btn.html();
                
                // Visual Feedback
                $btn.prop('disabled', true).css('opacity', '0.7').html('<i class="fas fa-circle-notch fa-spin"></i> Processing...');

                // Prepare Data
                const formData = new FormData(this);
                
                // Ensure Credit Hours is explicitly in the FormDat

                $.ajax({
                    url: $(this).attr('action'),
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(response) {
                        $('#message-container').html('<div class="alert"><i class="fas fa-check-circle"></i> Course saved! Redirecting...</div>');
                        
                        // Wait 1.5 seconds then refresh/redirect to see the data
                        setTimeout(function() {
                            window.location.href = "{% url 'view_courses' %}";
                        }, 1500);
                    },
                    error: function(xhr) {
                        const errorMsg = xhr.responseJSON ? xhr.responseJSON.message : "Server Error";
                        alert('Error: ' + errorMsg);
                        $btn.prop('disabled', false).css('opacity', '1').html(originalText);
                    }
                });
            });
        });
    </script>
</body>
</html>
