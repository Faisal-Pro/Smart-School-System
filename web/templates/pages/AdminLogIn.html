{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In</title>
  <link rel="icon" type="image/x-icon" href="{% static 'Images/School Logo.jpg' %}">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: 'Segoe UI', Arial, sans-serif;
           background: linear-gradient(135deg, #0a3a57, #0d4a6f 60%, #2f7fb8); }
    .card { background: #fff; width: 100%; max-width: 380px; padding: 36px 32px;
            border-radius: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.3); text-align: center; }
    .card img { width: 70px; border-radius: 12px; margin-bottom: 14px; }
    h1 { font-size: 22px; color: #0d2b3e; }
    p.sub { color: #64748b; font-size: 12px; margin: 6px 0 22px; letter-spacing: .6px; }
    label { display: block; text-align: left; font-size: 12px; font-weight: 600;
            color: #334155; margin: 12px 0 6px; }
    input { width: 100%; padding: 12px 14px; border: 1px solid #dbe4ee;
            background: #eaf1fb; border-radius: 10px; font-size: 14px; }
    input:focus { outline: 2px solid #2f7fb8; background: #fff; }
    button { width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 10px;
             background: #0d4a6f; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
    button:hover { background: #0a3a57; }
    .error { background: #fde8e8; color: #b42318; padding: 10px; border-radius: 8px;
             font-size: 13px; margin-bottom: 8px; }
    a.back { display: inline-block; margin-top: 18px; font-size: 13px;
             color: #64748b; text-decoration: none; }
  </style>
</head>
<body>
  <form class="card" method="POST" action="{% url 'AdminLogIn' %}" autocomplete="off">
    {% csrf_token %}
    <img src="{% static 'Images/School Logo.jpg' %}" alt="Logo">
    <h1>Admin Portal</h1>
    <p class="sub">AUTHORIZED STAFF ONLY</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>
    <button type="submit">Sign In</button>
    <a class="back" href="{% url 'MainPage' %}">← Back to Home</a>
  </form>
</body>
</html>
